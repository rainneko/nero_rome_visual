<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>尼禄重工纪元 · 罗马沙盘阅读器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --porph:#5b1f2e;--porph2:#7d2c3e;--gilt:#c9a24e;--gilt2:#e9cf8f;
  --paper:#f2e9d6;--paper2:#e6d9bf;--ink:#2b2119;--ink2:#6b5745;--rule:rgba(91,31,46,.2);
  --glass:rgba(26,19,14,.66);--gtext:#f1e6cf;--gmute:#c6b597;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --roman:"Cinzel","Trajan Pro",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2a221b;--paper2:#211a14;--ink:#eee2c9;--ink2:#bba78a;--rule:rgba(201,162,78,.22);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#2a221b;--paper2:#211a14;--ink:#eee2c9;--ink2:#bba78a;--rule:rgba(201,162,78,.22);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#17120e;font-family:var(--serif);color:var(--gtext)}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
button,select,input{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gilt2);outline-offset:2px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 18px;
  display:flex;gap:18px;align-items:flex-start;pointer-events:none;
  background:linear-gradient(180deg,rgba(22,16,12,.82),rgba(22,16,12,.5) 60%,rgba(22,16,12,0))}
#hud>*{pointer-events:auto}
.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:0 1 auto}
.year{font-family:var(--roman);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--gilt2);
  border:1px solid rgba(201,162,78,.5);padding:6px 9px;border-radius:3px;white-space:nowrap;background:rgba(91,31,46,.55)}
.brand h1{margin:0;font-size:16px;font-weight:600;color:#fff4dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:12px;color:var(--gmute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
#ledgers{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;justify-content:flex-end}
.led{background:rgba(14,10,8,.55);border:1px solid rgba(201,162,78,.28);border-radius:3px;padding:3px 7px;min-width:80px}
.led b{display:block;font-size:10.5px;font-weight:400;color:var(--gmute)}
.led span{font-size:12.5px;font-weight:600;color:#fff1d6;font-variant-numeric:tabular-nums;transition:color .6s}
.led span.up{color:var(--gilt2)}
.seg{display:flex;border:1px solid rgba(201,162,78,.5);border-radius:3px;overflow:hidden;flex:0 0 auto}
.seg button{background:rgba(14,10,8,.55);color:var(--gmute);border:0;padding:7px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--porph);color:#fff3da}

/* reader */
#reader{position:fixed;z-index:15;top:calc(78px + env(safe-area-inset-top,0px));right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(38vw,520px);display:flex;flex-direction:column;border-radius:6px;overflow:hidden;
  background:color-mix(in srgb,var(--paper) 94%,transparent);color:var(--ink);
  box-shadow:0 10px 40px rgba(0,0,0,.45);border:1px solid var(--rule);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#reader.closed{transform:translateX(calc(100% + 24px))}
.rhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--paper2)}
.rhead strong{font-size:14px;flex:1}
.rbtn{background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:3px;padding:4px 9px;font-size:12px;cursor:pointer}
.rbtn:hover{background:var(--porph);color:#fff3da;border-color:var(--porph)}
#rscroll{flex:1;overflow-y:auto;padding:22px 28px 40vh;scroll-behavior:smooth}
.ch{margin:0 0 56px;padding-left:16px;border-left:2px solid transparent;transition:border-color .5s,opacity .5s;opacity:.62}
.ch.on{border-left-color:var(--gilt);opacity:1}
.ch .when{font-size:12px;color:var(--ink2);margin:0 0 6px}
.ch h2{font-size:20px;line-height:1.35;margin:0 0 14px;font-weight:700}
.ch p{font-size:15.5px;line-height:1.95;margin:0 0 14px;text-align:justify;text-indent:2em}
.ch .note{font-size:12.5px;line-height:1.7;text-indent:0;color:var(--ink2);border-top:1px solid var(--rule);padding-top:8px}
#rtab{position:fixed;z-index:16;right:14px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;background:var(--porph);color:#fff3da;
  border:0;border-radius:4px;padding:12px 7px;font-size:13px;cursor:pointer;display:none}
#reader.closed ~ #rtab{display:block}

/* dock */
#dock{position:fixed;z-index:14;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;pointer-events:none}
#dock>*{pointer-events:auto}
.panel{background:var(--glass);border:1px solid rgba(201,162,78,.28);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#mapbox{padding:8px}
#minimap{display:block;width:210px;height:210px;border-radius:3px;cursor:crosshair}
#mapcap{font-size:11px;color:var(--gmute);margin-top:5px;max-width:210px;line-height:1.45}
#ctrl{padding:10px 12px;width:290px}
#views{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
#views button{background:rgba(255,255,255,.06);color:var(--gtext);border:1px solid rgba(201,162,78,.3);border-radius:3px;padding:4px 8px;font-size:12px;cursor:pointer}
#views button.on,#views button:hover{background:var(--porph);border-color:var(--gilt)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--gmute)}
.row label{flex:0 0 74px}
.row input[type=range]{flex:1;accent-color:var(--gilt)}
.row output{flex:0 0 58px;text-align:right;color:var(--gtext);font-size:11.5px}
.toggles{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tg{background:rgba(255,255,255,.06);color:var(--gtext);border:1px solid rgba(201,162,78,.3);border-radius:3px;padding:4px 8px;font-size:12px;cursor:pointer}
.tg.on{background:rgba(201,162,78,.25);border-color:var(--gilt)}

/* timeline */
#timeline{position:fixed;z-index:13;left:16px;right:calc(min(38vw,520px) + 40px);top:calc(84px + env(safe-area-inset-top,0px));height:30px;display:flex;align-items:flex-start;gap:2px;pointer-events:none}
#timeline button{pointer-events:auto;flex:1;min-width:0;background:none;border:0;border-top:2px solid rgba(241,230,207,.35);color:rgba(241,230,207,.7);
  font-size:11px;padding:6px 2px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
#timeline button.on{border-top-color:var(--gilt2);color:#fff3da;font-weight:600}
#timeline button.ant{border-top-style:dashed}

/* labels, card, loading */
#labels{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;
  font-size:12px;color:#fff6e2;background:rgba(32,22,15,.72);border:1px solid rgba(201,162,78,.45);border-radius:3px;padding:3px 7px 3px 6px;
  text-shadow:0 1px 2px #000;transition:opacity .35s}
.lab::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:rgba(233,207,143,.8)}
.lab.new{background:rgba(91,31,46,.85);border-color:var(--gilt2)}
.lab small{color:var(--gmute);margin-left:4px;font-size:10.5px}
#card{position:fixed;z-index:22;left:14px;top:calc(84px + env(safe-area-inset-top,0px));width:300px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--gtext)}
#card h3{margin:0 0 4px;font-size:15px;color:#fff3da}
#card .lat{font-family:var(--roman);font-size:11px;color:var(--gilt2);letter-spacing:.04em}
#card button{float:right;background:none;border:0;color:var(--gmute);font-size:18px;cursor:pointer;line-height:1}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#17120e;color:var(--gmute);font-size:14px;transition:opacity .8s}
#loading .yr{font-family:var(--roman);font-size:28px;color:var(--gilt2);letter-spacing:.08em;text-align:center;margin-bottom:10px}
#loading.gone{opacity:0;pointer-events:none}
@media (max-width:860px){
  #reader{top:auto;left:8px;right:8px;width:auto;height:46vh;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #reader.closed{transform:translateY(calc(100% + 20px))}
  #ledgers{display:none}
  #dock{bottom:calc(46vh + 18px);left:8px}
  #mapbox{display:none}
  #ctrl{width:240px}
  #timeline{left:8px;right:8px;bottom:calc(46vh + 14px);display:none}
  .brand p{max-width:60vw}
}
@media (prefers-reduced-motion:reduce){#reader{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<header id="hud">
  <div class="brand"><div class="year" id="hudYear">A.D. LIV</div><div><h1 id="hudTitle">正在建造罗马</h1><p id="hudSub"></p></div></div>
  <div id="ledgers"></div>
  <div class="seg" id="pages"><button data-page="rome" class="on">罗马</button><button data-page="antium">安齐奥</button></div>
</header>
<section id="reader">
  <div class="rhead"><strong>尼禄重工纪元</strong>
    <label class="rbtn" for="txt">导入全书 TXT</label><input id="txt" type="file" accept=".txt,.md" hidden>
    <button class="rbtn" id="rclose">收起</button></div>
  <div id="rscroll"></div>
</section>
<button id="rtab">展开正文</button>
<div id="dock">
  <div class="panel" id="mapbox"><canvas id="minimap" width="420" height="420"></canvas><div id="mapcap">小地图：点击可飞到该处</div></div>
  <div class="panel" id="ctrl">
    <div id="views"></div>
    <div class="row"><label for="tod">昼夜</label><input id="tod" type="range" min="0" max="1000" value="180"><output id="todv">清晨</output></div>
    <div class="row"><label for="glassop">玻璃不透明</label><input id="glassop" type="range" min="5" max="95" value="38"><output id="glassv">38%</output></div>
    <div class="toggles">
      <button class="tg on" id="tLabels">地名</button><button class="tg" id="tPaint">画意滤镜</button><button class="tg on" id="tCrystL" title="轻晶格油画：细而柔的多边形色块，和原图混合">轻晶格</button><button class="tg" id="tTilt">移轴</button>
      <button class="tg" id="tMusic">八音盒《卡农》</button><button class="tg" id="tBell">风铃</button>
      <label class="tg" for="glb">导入 .glb</label><input id="glb" type="file" accept=".glb,.gltf" hidden>
    </div>
  </div>
</div>
<div id="timeline"></div>
<div class="panel" id="card" hidden></div>
<div id="loading"><div><div class="yr">ROMA · A.D. LIV</div><div id="loadmsg">正在铺设七丘……</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function RNG(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(Math.imul(x|0,374761393)^Math.imul(y|0,668265263))>>>0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*13.7,y*f-i*7.3);f*=2.03;a*=.5;}return s;}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const TEST=/[?&]test/.test(location.search);
const isTouch=matchMedia('(pointer:coarse)').matches, small=Math.min(innerWidth,innerHeight)<700;
const Q=(isTouch||small)?{name:'low',pr:Math.min(devicePixelRatio,1.25),shadow:2048,dens:.4,trees:.45,msaa:0,paint:false}
  :{name:'high',pr:Math.min(devicePixelRatio,1.5),shadow:4096,dens:1,trees:1,msaa:4,paint:false};
if(TEST){Q.pr=1;}

/* ---------- GLSL ---------- */
const GL_NOISE=`
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float h13(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
float vn2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h12(i),h12(i+vec2(1,0)),u.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),u.x),u.y);}
float vn3(vec3 p){vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),u.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),u.x),u.y),
  mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),u.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),u.x),u.y),u.z);}
float fbm2(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn2(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
float fbm3(vec3 p){float s=0.,a=.5;for(int i=0;i<3;i++){s+=a*vn3(p);p=p*2.03+vec3(17.1,9.2,4.3);a*=.5;}return s;}
`;
const GL_ATMO=`
uniform vec3 uSunDir;uniform vec3 uSunCol;uniform vec3 uHazeCol;uniform vec4 uHaze;uniform float uTime;uniform float uNight;
uniform float uLit;uniform float uGlass;uniform float uWet;uniform float uBurn;uniform float uRust;uniform vec3 uSkyRefl;
vec3 atmo(vec3 col,vec3 wp){
 vec3 d=wp-cameraPosition;float dist=length(d);vec3 v=d/max(dist,.001);
 float H=uHaze.y;float h0=cameraPosition.y-uHaze.z,h1=wp.y-uHaze.z;float dy=h1-h0;
 float e0=exp(-max(h0,-60.)/H),e1=exp(-max(h1,-60.)/H);
 float od=abs(dy)<1.?uHaze.x*dist*e0:uHaze.x*dist*H*(e0-e1)/dy;od=max(od,0.);
 vec3 T=exp(-od*vec3(.6,.8,1.15));
 float mu=max(dot(v,uSunDir),0.);
 vec3 ins=uHazeCol+uSunCol*uHaze.w*(pow(mu,12.)*.9+pow(mu,3.)*.18);
 return col*T+ins*(1.-T);
}`;
const U={uTime:{value:0},uNight:{value:0},uSunDir:{value:new THREE.Vector3(.4,.5,.7).normalize()},uSunCol:{value:new THREE.Color(1,.9,.7)},
  uHazeCol:{value:new THREE.Color(.6,.62,.7)},uHaze:{value:new THREE.Vector4(1.6e-4,420,0,.8)},uLit:{value:0},uGlass:{value:.03},
  uWet:{value:0},uBurn:{value:0},uRust:{value:0},uSkyRefl:{value:new THREE.Color(.5,.6,.75)}};

function procMat(o){
  const M=o.physical?THREE.MeshPhysicalMaterial:THREE.MeshStandardMaterial;
  const m=new M(Object.assign({color:0xffffff,roughness:.8,metalness:0,envMapIntensity:o.env??.8},o.params||{}));
  m.onBeforeCompile=sh=>{
    for(const k in U)sh.uniforms[k]=U[k];
    if(o.uniforms)for(const k in o.uniforms)sh.uniforms[k]=o.uniforms[k];
    const head=GL_NOISE+GL_ATMO+'\nvarying vec3 vWP;varying vec3 vWN;\n';
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\n'+head+(o.vHead||''))
      .replace('#include <begin_vertex>','#include <begin_vertex>\n'+(o.vBody||''))
      .replace('#include <project_vertex>',`#include <project_vertex>
{vec4 aw=vec4(transformed,1.0);
#ifdef USE_INSTANCING
aw=instanceMatrix*aw;
#endif
aw=modelMatrix*aw;vWP=aw.xyz;vec3 an=objectNormal;
#ifdef USE_INSTANCING
an=mat3(instanceMatrix)*an;
#endif
vWN=normalize(mat3(modelMatrix)*an);}`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\n'+head+'struct PS{vec3 alb;float rough;float metal;vec3 nw;float useN;vec3 emit;float ao;};\n'+(o.fHead||'')+
        '\nPS surf(){PS S;S.alb=vec3(.6);S.rough=.85;S.metal=0.;S.nw=normalize(vWN);S.useN=0.;S.emit=vec3(0.);S.ao=1.;\n'+o.fSurf+'\nreturn S;}\n')
      .replace('#include <color_fragment>','#include <color_fragment>\nPS S=surf();diffuseColor.rgb*=S.alb;')
      .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=S.rough;')
      .replace('#include <metalnessmap_fragment>','#include <metalnessmap_fragment>\nmetalnessFactor=S.metal;')
      .replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\nif(S.useN>.5){normal=normalize((viewMatrix*vec4(S.nw,0.)).xyz);}')
      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance+=S.emit;')
      .replace('#include <aomap_fragment>','#include <aomap_fragment>\nreflectedLight.indirectDiffuse*=S.ao;reflectedLight.indirectSpecular*=S.ao;reflectedLight.directDiffuse*=mix(1.,S.ao,.35);')
      .replace('#include <fog_fragment>','gl_FragColor.rgb=atmo(gl_FragColor.rgb,vWP);');
  };
  m.customProgramCacheKey=()=>o.key;
  return m;
}
// simple shader material with atmosphere (for sprites/effects)
function fxMat(o){
  return new THREE.ShaderMaterial({uniforms:Object.assign({},U,o.uniforms||{}),transparent:true,depthWrite:false,
    blending:o.add?THREE.AdditiveBlending:THREE.NormalBlending,side:o.side||THREE.FrontSide,
    vertexShader:GL_NOISE+GL_ATMO+o.vs,fragmentShader:GL_NOISE+GL_ATMO+o.fs});
}

/* ---------- renderer & post ---------- */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',stencil:false,preserveDrawingBuffer:TEST});
THREE.ColorManagement.legacyMode=false;
renderer.outputEncoding=THREE.LinearEncoding;renderer.toneMapping=THREE.NoToneMapping;
renderer.physicallyCorrectLights=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Q.pr);
const camera=new THREE.PerspectiveCamera(38,1,4,60000);
const VS_FS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const fsScene=new THREE.Scene(),fsCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const FSQ=new THREE.Mesh(new THREE.PlaneGeometry(2,2));FSQ.frustumCulled=false;fsScene.add(FSQ);
function fsPass(mat,target){FSQ.material=mat;renderer.setRenderTarget(target);renderer.render(fsScene,fsCam);}
const mkRT=(w,h,o={})=>new THREE.WebGLRenderTarget(w,h,Object.assign({type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false},o));
const P={rt:null,mips:[],blur:null,ldr:null,w:1,h:1,
  down:new THREE.ShaderMaterial({uniforms:{t:{value:null},tx:{value:new THREE.Vector2()},thr:{value:-1}},vertexShader:VS_FS,fragmentShader:`
